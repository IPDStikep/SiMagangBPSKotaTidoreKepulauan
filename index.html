<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0a4988">
<link rel="manifest" href="/manifest.json">
<title>SiMagang &middot; BPS Kota Tidore Kepulauan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
<style>
/* ===== DESIGN TOKENS & THEME SYSTEM ===== */
:root {
  --p: #0a4988;
  --p-hover: #08386b;
  --p-soft: rgba(10, 73, 136, 0.10);
  --accent: #0ea5e9;
  --bg: #f1f5f9;
  --c: #ffffff;
  --c2: #f8fafc;
  --t: #0f172a;
  --t2: #334155;
  --m: #64748b;
  --b: #e2e8f0;
  --b2: #cbd5e1;
  --ok: #15803d;
  --ok-bg: rgba(21, 128, 61, 0.12);
  --wr: #b45309;
  --wr-bg: rgba(180, 83, 9, 0.14);
  --er: #b91c1c;
  --er-bg: rgba(185, 28, 28, 0.12);
  --bl: #1d4ed8;
  --bl-bg: rgba(29, 78, 216, 0.12);
  --pu: #6d28d9;
  --pu-bg: rgba(109, 40, 217, 0.12);
  --nav-bg: linear-gradient(180deg, #07274d 0%, #0a4280 100%);
  --sh-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --sh: 0 4px 12px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
  --sh-lg: 0 20px 40px -8px rgba(15, 23, 42, 0.18);
  --r: 12px;
  --r-sm: 8px;
  color-scheme: light;
}

[data-theme="dark"] {
  --p: #60a5fa;
  --p-hover: #93c5fd;
  --p-soft: rgba(96, 165, 250, 0.14);
  --accent: #38bdf8;
  --bg: #090e1a;
  --c: #111827;
  --c2: #192234;
  --t: #f1f5f9;
  --t2: #cbd5e1;
  --m: #94a3b8;
  --b: #1e293b;
  --b2: #334155;
  --ok: #4ade80;
  --ok-bg: rgba(74, 222, 128, 0.15);
  --wr: #fbbf24;
  --wr-bg: rgba(251, 191, 36, 0.16);
  --er: #f87171;
  --er-bg: rgba(248, 113, 113, 0.16);
  --bl: #60a5fa;
  --bl-bg: rgba(96, 165, 250, 0.16);
  --pu: #c084fc;
  --pu-bg: rgba(192, 132, 252, 0.16);
  --nav-bg: linear-gradient(180deg, #061326 0%, #0b2242 100%);
  --sh-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --sh: 0 4px 16px rgba(0, 0, 0, 0.35);
  --sh-lg: 0 24px 48px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.55;
  background: var(--bg);
  color: var(--t);
  transition: background-color 0.2s ease, color 0.2s ease;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--p); outline-offset: 2px; }

/* ===== TOP PROGRESS BAR ===== */
#bar {
  position: fixed; top: 0; left: 0; height: 3px; width: 100%;
  background: linear-gradient(90deg, var(--p), var(--accent));
  z-index: 9999; opacity: 0; transform-origin: left; pointer-events: none;
  transition: opacity 0.2s;
}
#bar.on { opacity: 1; animation: barAnim 1.2s ease-in-out infinite; }
@keyframes barAnim {
  0% { transform: scaleX(0.05); }
  55% { transform: scaleX(0.82); }
  100% { transform: scaleX(0.98); }
}

/* ===== LOGO (TRANSPARENT / NO WHITE BOX) ===== */
.logo {
  display: block;
  width: auto;
  object-fit: contain;
  background: transparent !important;
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.18));
}
.logo:not([src]), .logo[src=""] { display: none; }

/* ===== BUTTONS & ICON BUTTONS ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-width: 120px; height: 40px; padding: 0 16px;
  border: 1px solid transparent; border-radius: var(--r-sm);
  background: var(--p); color: #ffffff;
  font-weight: 600; font-size: 13.5px; white-space: nowrap;
  cursor: pointer; transition: all 0.15s ease;
}
[data-theme="dark"] .btn { color: #061326; }
.btn:hover:not(:disabled) { background: var(--p-hover); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.btn.s {
  background: var(--c); color: var(--t); border-color: var(--b2);
}
[data-theme="dark"] .btn.s { color: var(--t); }
.btn.s:hover:not(:disabled) { background: var(--c2); border-color: var(--p); }

.btn.d { background: var(--er); color: #ffffff; }
[data-theme="dark"] .btn.d { color: #ffffff; }
.btn.d:hover:not(:disabled) { filter: brightness(1.08); }

.btn.sm { min-width: auto; height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 6px; }
.btn.full { width: 100%; }

.ib {
  width: 38px; height: 38px; flex: none;
  border-radius: var(--r-sm); border: 1px solid var(--b);
  background: var(--c); color: var(--t2);
  display: grid; place-items: center; cursor: pointer;
  transition: all 0.15s ease;
}
.ib:hover { background: var(--c2); color: var(--p); border-color: var(--b2); }

svg.i {
  width: 19px; height: 19px; stroke: currentColor; fill: none;
  stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; flex: none;
}

/* ===== FORMS & VALIDATION ===== */
.fld { margin-top: 14px; }
.fld:first-child { margin-top: 0; }
.fld label, label {
  display: block; margin: 0 0 6px;
  color: var(--t2); font-size: 13px; font-weight: 600;
}
input, select, textarea {
  width: 100%; height: 42px; min-height: 42px; padding: 9px 13px;
  border: 1px solid var(--b2); border-radius: var(--r-sm);
  background: var(--c2); color: var(--t);
  transition: border-color 0.15s, box-shadow 0.15s, background-color 0.15s;
}
textarea { height: auto; min-height: 88px; resize: vertical; }
input[type="file"] { height: auto; padding: 8px 12px; font-size: 13px; }
input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; display: block; line-height: 1.2; }
input:focus, select:focus, textarea:focus {
  border-color: var(--p); background: var(--c);
  box-shadow: 0 0 0 3px var(--p-soft); outline: none;
}
input.inv, select.inv, textarea.inv {
  border-color: var(--er) !important;
  background: var(--er-bg);
}
.fe {
  color: var(--er); font-size: 12px; font-weight: 500;
  margin-top: 5px; display: flex; align-items: center; gap: 4px;
}
.fe:empty { display: none; }

/* ===== LOGIN SCREEN ===== */
#login {
  display: grid; grid-template-columns: 1.15fr 1fr; min-height: 100vh;
}
.lb {
  background: var(--nav-bg); color: #ffffff;
  padding: 56px 48px; display: flex; flex-direction: column; justify-content: center;
  position: relative; overflow: hidden;
}
.lb::before {
  content: ""; position: absolute; right: -120px; bottom: -120px;
  width: 380px; height: 380px; border-radius: 50%;
  background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, transparent 70%);
  pointer-events: none;
}
.lb-inner { max-width: 440px; position: relative; z-index: 1; }
.lb .logo { height: 68px; margin-bottom: 24px; }
.lb h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 8px; }
.lb .sub-org { font-size: 16px; font-weight: 600; color: #bae6fd; margin-bottom: 16px; }
.lb .tagline {
  display: inline-block; padding: 6px 14px; border-radius: 99px;
  background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.16);
  font-size: 13px; font-style: italic; color: #e0f2fe;
}

.lf {
  display: flex; align-items: center; justify-content: center;
  padding: 32px 24px; background: var(--c); position: relative;
}
.lf > .ib { position: absolute; top: 20px; right: 20px; }
.lf-box { width: 100%; max-width: 380px; }
.lf-box h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
.lf-box .desc { color: var(--m); font-size: 13.5px; margin: 4px 0 22px; }
.pw { position: relative; }
.pw input { padding-right: 44px; }
.pw .ib {
  position: absolute; right: 2px; top: 2px; height: 38px; width: 38px;
  border: 0; background: transparent;
}
#le {
  color: var(--er); font-size: 13px; font-weight: 500;
  margin-top: 10px; min-height: 20px;
}
#le:not(:empty) {
  padding: 8px 12px; border-radius: var(--r-sm);
  background: var(--er-bg); border: 1px solid rgba(185, 28, 28, 0.25);
}
.forgot-link {
  display: inline-block; margin-top: 14px; font-size: 13px;
  color: var(--p); text-decoration: none; font-weight: 600;
}
.forgot-link:hover { text-decoration: underline; }

/* ===== APP SHELL & SIDEBAR ===== */
#app { display: none; min-height: 100vh; }
nav {
  position: fixed; inset: 0 auto 0 0; width: 256px;
  background: var(--nav-bg); color: #ffffff;
  padding: 18px 12px; display: flex; flex-direction: column; gap: 3px;
  z-index: 30; overflow-y: auto; transition: width 0.2s ease, transform 0.22s ease;
}
nav .br {
  display: flex; align-items: center; gap: 12px;
  padding: 4px 8px 18px; margin-bottom: 6px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
}
nav .br .logo { height: 38px; flex: none; }
nav .br-txt { font-weight: 700; font-size: 13.5px; line-height: 1.25; }
nav .br-txt small { display: block; font-weight: 400; font-size: 11.5px; color: #bae6fd; margin-top: 2px; }

nav a {
  display: flex; align-items: center; gap: 12px;
  height: 41px; padding: 0 12px; border-radius: var(--r-sm);
  color: #cbd5e1; cursor: pointer; font-weight: 500; font-size: 13.5px;
  transition: all 0.15s ease; user-select: none;
}
nav a:hover { background: rgba(255, 255, 255, 0.09); color: #ffffff; }
nav a.on {
  background: rgba(255, 255, 255, 0.16); color: #ffffff; font-weight: 600;
  box-shadow: inset 3px 0 0 #38bdf8;
}

.wrap { margin-left: 256px; min-height: 100vh; display: flex; flex-direction: column; transition: margin-left 0.2s ease; }

/* ===== STICKY HEADER ===== */
#top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  height: 62px; padding: 0 24px;
  background: var(--c); border-bottom: 1px solid var(--b);
}
.bc { color: var(--m); font-size: 13.5px; }
.bc b { color: var(--t); font-weight: 600; }
.dt { color: var(--m); font-size: 13px; margin-right: 4px; }

.bell { position: relative; }
.bell i {
  position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px;
  padding: 0 4px; border-radius: 99px; background: var(--er); color: #ffffff;
  font-size: 10.5px; font-weight: 700; line-height: 18px; text-align: center; font-style: normal;
  border: 2px solid var(--c);
}

.pf {
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; padding: 4px 8px; border-radius: var(--r-sm);
  transition: background-color 0.15s;
}
.pf:hover { background: var(--c2); }
.av {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--p); color: #ffffff;
  display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none;
}
[data-theme="dark"] .av { color: #061326; }
.nm { line-height: 1.25; }
.nm b { display: block; font-size: 13.5px; color: var(--t); }
.nm small { color: var(--m); font-size: 11.5px; }

/* ===== MAIN CONTENT AREA ===== */
main {
  width: 100%; max-width: 1220px; margin: 0 auto;
  padding: 24px; flex: 1;
  animation: fadeIn 0.22s ease-out;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

.top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 18px;
}
.top h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.top span { display: flex; gap: 8px; flex-wrap: wrap; }
.sec { margin: 6px 0 12px; font-size: 15.5px; font-weight: 700; color: var(--t); }

/* ===== CARDS & HERO ===== */
.card {
  background: var(--c); border: 1px solid var(--b);
  border-radius: var(--r); padding: 18px 20px; box-shadow: var(--sh);
}
.hero {
  background: var(--c); border: 1px solid var(--b); border-left: 4px solid var(--p);
  border-radius: var(--r); padding: 20px 22px; margin-bottom: 18px; box-shadow: var(--sh-sm);
}
.hero h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.hero p { color: var(--m); font-size: 13.5px; }

.cards {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
  gap: 14px; margin-bottom: 18px;
}
.st {
  display: flex; align-items: center; gap: 14px; padding: 16px 18px;
}
.st b { display: block; font-size: 24px; font-weight: 700; line-height: 1.2; color: var(--t); }
.st span { color: var(--m); font-size: 12.5px; font-weight: 500; }

.si {
  width: 44px; height: 44px; border-radius: 10px;
  display: grid; place-items: center; flex: none; font-style: normal;
}
.si.b { background: var(--bl-bg); color: var(--bl); }
.si.g { background: var(--ok-bg); color: var(--ok); }
.si.w { background: var(--wr-bg); color: var(--wr); }
.si.r { background: var(--er-bg); color: var(--er); }
.si.p { background: var(--pu-bg); color: var(--pu); }

/* ===== DASHBOARD GRIDS ===== */
.g2 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; margin-bottom: 18px; }
.g3 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 18px; align-items: start; }
.g2c { display: grid; grid-template-columns: minmax(300px, 370px) minmax(0, 1fr); gap: 18px; margin-bottom: 18px; align-items: start; }
.side { display: grid; gap: 16px; }
.pn h3 { margin: 0 0 12px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; }

.pg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pg2 div { font-weight: 500; font-size: 13.5px; }
.pg2 small { display: block; color: var(--m); font-size: 11.5px; font-weight: 600; margin-bottom: 2px; }

.chip {
  display: inline-block; padding: 4px 10px; border-radius: 99px;
  background: var(--c2); border: 1px solid var(--b);
  font-size: 12px; font-weight: 500; margin: 0 6px 6px 0;
}

.tl { max-height: 260px; overflow-y: auto; }
.ti { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--b); font-size: 13px; }
.ti:last-child { border-bottom: 0; padding-bottom: 0; }
.ti i { width: 8px; height: 8px; border-radius: 50%; background: var(--p); margin-top: 6px; flex: none; }
.ti small { display: block; color: var(--m); font-size: 11.5px; margin-top: 2px; }

.an { padding: 14px 0; border-bottom: 1px solid var(--b); }
.an:first-child { padding-top: 0; }
.an:last-child { border-bottom: 0; padding-bottom: 0; }
.an small { color: var(--m); font-size: 12px; }

/* ===== ATTENDANCE & GPS WIDGET ===== */
.abs {
  text-align: center; padding: 26px 20px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.abs .jam {
  font-size: clamp(36px, 6vw, 52px); font-weight: 800; letter-spacing: -0.02em;
  color: var(--p); font-variant-numeric: tabular-nums; line-height: 1.1; margin-bottom: 8px;
}
.abs .row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

.gps-pill {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;
  padding: 6px 14px; border-radius: 99px; font-size: 12.5px; font-weight: 600;
  background: var(--c2); border: 1px solid var(--b); color: var(--m);
}
.gps-pill.ok { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.gps-pill.er { background: var(--er-bg); border-color: transparent; color: var(--er); }
.gps-pill.wr { background: var(--wr-bg); border-color: transparent; color: var(--wr); }

.cam-box {
  position: relative; width: 100%; max-width: 340px; margin: 14px auto;
  border-radius: var(--r); overflow: hidden; background: #000;
  aspect-ratio: 4/3; border: 2px solid var(--b);
}
.cam-box video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

/* ===== TABLES & BADGES ===== */
.tb2 {
  display: flex; justify-content: space-between; align-items: center;
  gap: 10px; flex-wrap: wrap; margin-bottom: 12px;
}
.tb2 input, .tb2 select { max-width: 250px; height: 38px; min-height: 38px; }
.pg { display: flex; gap: 6px; align-items: center; color: var(--m); font-size: 13px; }
.pg button {
  min-width: 34px; height: 34px; border: 1px solid var(--b2);
  background: var(--c); color: var(--t); border-radius: 6px; cursor: pointer;
}
.pg button:hover:not(:disabled) { border-color: var(--p); color: var(--p); }
.pg button:disabled { opacity: 0.4; cursor: not-allowed; }

.tw {
  overflow-x: auto; background: var(--c); border: 1px solid var(--b);
  border-radius: var(--r); box-shadow: var(--sh-sm);
}
table { border-collapse: collapse; width: 100%; min-width: 620px; }
th, td {
  padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--b);
  white-space: nowrap; font-size: 13.5px;
}
th {
  background: var(--c2); color: var(--m); font-size: 11.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.04em;
}
tbody tr:hover td, tr:hover > td { background: var(--c2); }
tr:last-child td { border-bottom: 0; }
tr[hidden] { display: none !important; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
td.ac { white-space: normal; }

.tg {
  display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 99px;
  font-size: 12px; font-weight: 600; background: var(--c2); border: 1px solid var(--b); color: var(--m);
}
.tg.ok { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.tg.wr { background: var(--wr-bg); border-color: transparent; color: var(--wr); }
.tg.er { background: var(--er-bg); border-color: transparent; color: var(--er); }
.tg.bl { background: var(--bl-bg); border-color: transparent; color: var(--bl); }

/* ===== CALENDAR ===== */
.calh { font-size: 14.5px; font-weight: 700; margin: 0 0 10px; color: var(--t); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; max-width: 340px; }
.cal .cw { font-size: 11px; font-weight: 700; color: var(--m); text-align: center; padding: 2px 0 4px; text-transform: uppercase; }
.cal .cd {
  height: 34px; display: flex; align-items: center; justify-content: center;
  border-radius: 8px; font-size: 12.5px; font-weight: 600;
  background: var(--c2); color: var(--t);
}
.cal .cd.e { background: transparent; }
.cal .cd.w { background: transparent; color: var(--m); font-weight: 500; }
.cal .cd.f { color: var(--m); font-weight: 500; opacity: 0.6; }
.cal .cd.h { background: var(--ok-bg); color: var(--ok); }
.cal .cd.t { background: var(--wr-bg); color: var(--wr); }
.cal .cd.i { background: var(--bl-bg); color: var(--bl); }
.cal .cd.a { background: var(--er-bg); color: var(--er); }
.cal .cd.n { outline: 2px solid var(--p); outline-offset: -2px; opacity: 1; }

.cleg { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 12px; font-size: 12px; color: var(--m); }
.cleg span { display: inline-flex; align-items: center; gap: 6px; }
.cleg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
.cleg .lh { background: var(--ok); } .cleg .lt { background: var(--wr); }
.cleg .li { background: var(--bl); } .cleg .la { background: var(--er); }

/* ===== MODAL, TOAST, SKELETON & SWEETALERT2 THEME SYNC ===== */
#mod {
  position: fixed; inset: 0; background: rgba(9, 14, 26, 0.6);
  backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center;
  padding: 16px; z-index: 60;
}
#mod > div {
  background: var(--c); color: var(--t); border: 1px solid var(--b);
  border-radius: 16px; padding: 24px; width: 100%; max-width: 490px;
  max-height: 90vh; overflow-y: auto; box-shadow: var(--sh-lg);
  animation: fadeIn 0.2s ease-out;
}
#mod h2 { font-size: 19px; font-weight: 700; margin-bottom: 14px; }
#mod .ft { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

#toast {

  v = v || {};

    var val = v[f.k] != null ? v[f.k] : (f.d != null ? f.d : '');
    var id = 'f_' + f.k;

        var a = Array.isArray(o) ? o : [o, o];
        return '<option value="' + esc(a[0]) + '" ' + (a[0] == val ? 'selected' : '') + '>' + esc(a[1]) + '</option>';
      }).join('') + '</select>';
    } else if (f.t === 'textarea') {
      inp = '<textarea id="' + id + '" rows="3">' + esc(val) + '</textarea>';
    } else {
      inp = '<input id="' + id + '" type="' + (f.t || 'text') + '" value="' + esc(val) + '" ' +
        (f.dl ? 'list="dl_' + f.k + '"' : '') + ' ' + (f.acc ? 'accept="' + f.acc + '"' : '') + '>' +
        (f.dl ? '<datalist id="dl_' + f.k + '">' + f.dl.map(function(x) { return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>' : '');
    }
    return '<div class="fld"><label for="' + id + '">' + f.l + rq + '</label>' + inp + '<div class="fe" id="e_' + f.k + '" role="alert"></div></div>';
  }).join('');

  modal('<h2>' + esc(title) + '</h2>' + fHtml +
    '<div class="ft"><button class="btn s" type="button" onclick="closeM()">Batal</button><button class="btn" type="button" id="fok">' + (okText || 'Simpan') + '</button></div>');

  var bad = function(k, m) {
    var e = $('#e_' + k), x = $('#f_' + k);
    if (e) e.textContent = m;
    if (x) { x.classList.add('inv'); x.focus(); }
    return false;
  };

  $('#fok').onclick = async function() {
    var b = $('#fok'), o = Object.assign({}, v);
    document.querySelectorAll('.fe').forEach(function(e) { e.textContent = ''; });
    document.querySelectorAll('.inv').forEach(function(e) { e.classList.remove('inv'); });
    try {
      for (var idx = 0; idx < fields.length; idx++) {
        var f = fields[idx];

        var e = $('#f_' + f.k);

/* ---- GPS REAL-TIME MONITOR ---- */
function calcDist(lat1, lng1, lat2, lng2) {
  var r = Math.PI / 180;
  var x = Math.sin((lat2 - lat1) * r / 2) * Math.sin((lat2 - lat1) * r / 2) +
          Math.cos(lat1 * r) * Math.cos(lat2 * r) *
          Math.sin((lng2 - lng1) * r / 2) * Math.sin((lng2 - lng1) * r / 2);
  return Math.round(12742000 * Math.asin(Math.sqrt(x)));
}

function stopWatch() {
  if (GPS_WATCH !== null && navigator.geolocation) {
    navigator.geolocation.clearWatch(GPS_WATCH);
    GPS_WATCH = null;
  }
}

function startWatch() {
  stopWatch();
  var el = $('#gps-ind');
  if (!el || !navigator.geolocation) return;
  el.className = 'gps-pill';
  el.textContent = 'Mendeteksi posisi GPS...';

  GPS_WATCH = navigator.geolocation.watchPosition(function(p) {
    LAST_POS = {
      lat: p.coords.latitude,
      lng: p.coords.longitude,
      acc: p.coords.accuracy,
      ts: Date.now()
    };
    var la = +CFG.kantor_lat, ln = +CFG.kantor_lng, rad = +CFG.radius || 50, maxAcc = +CFG.maks_akurasi || 100;
    if (!la || !ln) {
      el.className = 'gps-pill wr';
      el.textContent = 'Koordinat kantor belum diatur Admin';
      return;
    }
    var j = calcDist(p.coords.latitude, p.coords.longitude, la, ln);
    var acc = Math.round(p.coords.accuracy);
    if (acc > maxAcc) {
      el.className = 'gps-pill wr';
      el.textContent = 'Sinyal GPS lemah (akurasi ' + acc + ' m, maks ' + maxAcc + ' m)';
    } else if (j <= rad) {
      el.className = 'gps-pill ok';
      el.textContent = 'Dalam radius kantor (' + j + ' m / batas ' + rad + ' m)';
    } else {
      el.className = 'gps-pill er';
      el.textContent = 'Di luar radius (' + j + ' m dari kantor, batas ' + rad + ' m)';
    }
  }, function() {
    if (el) {
      el.className = 'gps-pill er';
      el.textContent = 'Akses lokasi ditolak / GPS tidak aktif';
    }
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });
}

function csv(w, rs) {
  var NL = String.fromCharCode(10);
  var q = function(x) { return '"' + String(x).replace(/"/g, '""') + '"'; };
  var hd = Array.prototype.slice.call(w.querySelectorAll('tr')[0].cells).map(function(c) { return c.textContent.trim(); });
  var ci = hd.map(function(x, i) { return i; }).filter(function(i) { return hd[i] && hd[i] !== 'Aksi'; });
  var rows = [ci.map(function(i) { return hd[i]; })].concat(rs.map(function(r) {
    return ci.map(function(i) { return r.cells[i].textContent.trim(); });
  }));
  dl({
    b64: btoa(unescape(encodeURIComponent(String.fromCharCode(65279) + rows.map(function(r) { return r.map(q).join(','); }).join(NL)))),
    mime: 'text/csv',
    name: 'data_simagang_' + today() + '.csv'
  });
  toast('File CSV berhasil diunduh');
}

function enhance() {
  document.querySelectorAll('.tw').forEach(function(w) {
    if (w.dataset.e) return;
    var rs = Array.prototype.slice.call(w.querySelector('table').rows).slice(1);
    if (rs.length <= 8) return;
    w.dataset.e = 1;
    var pg = 1, q = '';
    var b = document.createElement('div');
    b.className = 'tb2';
    b.innerHTML = '<input placeholder="Cari data pada tabel..." aria-label="Cari data">' +
                  '<button class="btn s sm" type="button">Ekspor CSV</button>' +
                  '<div class="pg"></div>';
    w.before(b);
    var g = b.lastChild;
    b.children[1].onclick = function() { csv(w, rs); };

    var draw = function() {
      var m = rs.filter(function(r) { return r.textContent.toLowerCase().includes(q); });
      var n = Math.max(1, Math.ceil(m.length / 10));
      pg = Math.min(pg, n);
      rs.forEach(function(r) { r.hidden = true; });
      m.slice((pg - 1) * 10, pg * 10).forEach(function(r) { r.hidden = false; });
      g.innerHTML = '<span>' + m.length + ' data</span>' +
        '<button type="button" ' + (pg < 2 ? 'disabled' : '') + ' data-p="-1" aria-label="Sebelumnya">&lsaquo;</button>' +
        '<span>' + pg + ' / ' + n + '</span>' +
        '<button type="button" ' + (pg >= n ? 'disabled' : '') + ' data-p="1" aria-label="Berikutnya">&rsaquo;</button>';
      g.querySelectorAll('button').forEach(function(x) {
        x.onclick = function() { pg += +x.dataset.p; draw(); };
      });
    };
    b.firstChild.oninput = function(e) { q = e.target.value.toLowerCase(); pg = 1; draw(); };
    draw();
  });
}

function dl(r) {
  var b = atob(r.b64), u = new Uint8Array(b.length);
  for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([u], { type: r.mime }));
  a.download = r.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

var shrink = function(f, m) {
  return new Promise(function(ok) {
    var r = new FileReader();
    r.onload = function() {
      var im = new Image();
      im.onload = function() {
        var k = Math.min(1, m / Math.max(im.width, im.height));
        var c = document.createElement('canvas');
        c.width = im.width * k;
        c.height = im.height * k;
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.72));
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  });
};

var compress = function(f) {
  return new Promise(function(ok, no) {
    var r = new FileReader();
    r.onerror = function() { no(new Error('File tidak dapat dibaca')); };
    r.onload = function() {
      var im = new Image();
      im.onerror = function() { no(new Error('File gambar tidak valid')); };
      im.onload = function() {
        var s = Math.min(1, 2400 / Math.max(im.width, im.height)), q = 0.92, out = '';
        var sz = function(u) { return Math.floor((u.length - u.indexOf(',') - 1) * 0.75); };
        for (var n = 0; n < 14; n++) {
          var c = document.createElement('canvas');
          c.width = Math.round(im.width * s);
          c.height = Math.round(im.height * s);
          var x = c.getContext('2d');
          x.fillStyle = '#fff';
          x.fillRect(0, 0, c.width, c.height);
          x.drawImage(im, 0, 0, c.width, c.height);
          out = c.toDataURL('image/jpeg', q);
          if (sz(out) <= 95e4) return ok(out);
          if (q > 0.74) q -= 0.06;
          else { s *= 0.85; q = 0.88; }
        }
        no(new Error('Gambar terlalu besar untuk dikompres, gunakan gambar lain'));
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  });
};

var readF = function(f) {
  if (f.size > 5e6) return Promise.reject(new Error('Ukuran file maksimal 5 MB'));
  if (f.size > 1e6 && f.type.indexOf('image/') === 0) {
    toast('Mengompres gambar lampiran...');
    return compress(f);
  }
  if (f.size > 1e6) return Promise.reject(new Error('File PDF maksimal 1 MB'));
  return new Promise(function(ok, no) {
    var r = new FileReader();
    r.onload = function() { ok(r.result); };
    r.onerror = function() { no(new Error('File tidak dapat dibaca')); };
    r.readAsDataURL(f);
  });
};

function chart(t) {
  if (!t || !t.length) return '';
  var W = 640, H = 185, m = 28;
  var mx = Math.max(1, Math.max.apply(null, t.map(function(x) { return x.hadir + x.alfa; })));
  var bw = (W - m) / t.length;
  var bars = t.map(function(x, i) {
    var xx = m + i * bw + 4, w = Math.max(6, bw - 8), y = H - 22;
    var r = function(v, c) {
      var g = v / mx * (H - 36);
      y -= g;
      return '<rect x="' + xx + '" y="' + y + '" width="' + w + '" height="' + g + '" rx="2" fill="' + c + '"></rect>';
    };
    return r(x.hadir - x.terlambat, '#15803d') +
           r(x.terlambat, '#d97706') +
           r(x.alfa, '#dc2626') +
           '<text x="' + (xx + w / 2) + '" y="' + (H - 6) + '" font-size="10" text-anchor="middle" style="fill:var(--m)">' + x.tgl.slice(8) + '/' + x.tgl.slice(5, 7) + '</text>';
  }).join('');

  return '<div class="card" style="margin-bottom:18px">' +
    '<div style="font-weight:700;font-size:15px;margin-bottom:8px">Tren Kehadiran 14 Hari Terakhir</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto" role="img" aria-label="Grafik kehadiran">' +
      '<text x="0" y="12" font-size="10" style="fill:var(--m)">' + mx + '</text>' + bars +
    '</svg>' +
    '<div class="cleg" style="margin-top:6px">' +
      '<span><i class="lh"></i>Tepat Waktu</span>' +
      '<span><i class="lt"></i>Terlambat</span>' +
      '<span><i class="la"></i>Alfa</span>' +
    '</div>' +
  '</div>';
}

function ambilKoordinatKantor() {
  if (!navigator.geolocation) return toast('Perangkat tidak mendukung GPS', 'error');
  toast('Mengunci titik koordinat lokasi Anda...');
  navigator.geolocation.getCurrentPosition(function(p) {
    $('#c_kantor_lat').value = p.coords.latitude.toFixed(6);
    $('#c_kantor_lng').value = p.coords.longitude.toFixed(6);
    toast('Koordinat diperbarui (akurasi ' + Math.round(p.coords.accuracy) + ' m). Klik Simpan Pengaturan untuk menerapkan.');
  }, function() {
    toast('Izinkan akses lokasi pada browser Anda', 'error');
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}

function cekJarak() {

  if (!navigator.geolocation) return toast('Perangkat tidak mendukung GPS', 'error');

    var j = calcDist(p.coords.latitude, p.coords.longitude, la, ln);

    toast('Izinkan akses lokasi pada browser Anda', 'error');
  }, { enableHighAccuracy: true, timeout: 20000 });
}

/* ---- LIVE CAMERA & INSTANT GEO ABSEN ---- */
async function geo(tipe) {
  if (!await ask('Konfirmasi Absen ' + (tipe === 'masuk' ? 'Masuk' : 'Pulang') + '?', 'Pastikan GPS aktif dan posisi Anda berada di dalam radius kantor.')) return;
  if (CFG.wajib_foto === 'TRUE') {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      try {
        CAM_STREAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 } }, audio: false });
        modal('<h2>Swafoto Absensi (' + (tipe === 'masuk' ? 'Masuk' : 'Pulang') + ')</h2>' +
          '<p style="color:var(--m);font-size:13px">Posisikan wajah Anda dengan jelas di dalam bingkai kamera.</p>' +
          '<div class="cam-box"><video id="cam-v" autoplay playsinline></video></div>' +
          '<div class="ft"><button class="btn s" type="button" onclick="closeM()">Batal</button><button class="btn" type="button" id="cam-snap">' + ic('cam') + ' Ambil Foto & Absen</button></div>');
        var v = $('#cam-v');
        v.srcObject = CAM_STREAM;
        $('#cam-snap').onclick = function() {
          var c = document.createElement('canvas');
          c.width = v.videoWidth || 640;
          c.height = v.videoHeight || 480;
          var ctx = c.getContext('2d');
          ctx.translate(c.width, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(v, 0, 0, c.width, c.height);
          var foto = c.toDataURL('image/jpeg', 0.75);
          closeM();
          doGeo(tipe, foto);
        };
        return;
      } catch (err) {
        toast('Kamera langsung tidak tersedia, beralih ke unggah kamera perangkat...', 'info');
      }
    }
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.setAttribute('capture', 'user');
    inp.onchange = async function() {
      if (inp.files[0]) doGeo(tipe, await shrink(inp.files[0], 640));
    };
    inp.click();
    return;
  }
  doGeo(tipe, '');
}

async function sendAbsen(tipe, lat, lng, acc, foto) {
  try {
    var r = await call('absen', { tipe: tipe, lat: lat, lng: lng, acc: acc, foto: foto });
    toast('Absen ' + tipe + ' berhasil pukul ' + r.jam + ' (' + r.jarak + ' m dari kantor)');
    go(ME.role === 'peserta' && $('#gps-ind') ? 'absen' : 'dash');
  } catch (e) {
    toast(e.message, 'error');
  }
}

function doGeo(tipe, foto) {
  if (!navigator.geolocation) return toast('Perangkat tidak mendukung GPS', 'error');
  // Gunakan LAST_POS jika baru diambil (< 15 detik) dan akurasinya memenuhi syarat
  if (LAST_POS && (Date.now() - LAST_POS.ts) < 15000 && LAST_POS.acc <= (+CFG.maks_akurasi || 100)) {
    return sendAbsen(tipe, LAST_POS.lat, LAST_POS.lng, LAST_POS.acc, foto);
  }
  toast('Mengunci koordinat GPS...');
  navigator.geolocation.getCurrentPosition(function(p) {
    sendAbsen(tipe, p.coords.latitude, p.coords.longitude, p.coords.accuracy, foto);
  }, function() {
    toast('Lokasi gagal diperoleh: pastikan izin lokasi (GPS) aktif di browser', 'error');
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}

/* ---- ROUTER ---- */
async function go(v) {
  stopWatch();
  stopCam();
  document.querySelectorAll('nav a').forEach(function(a) { a.classList.toggle('on', a.dataset.v === v); });
  var mi = MENU[ME.role].find(function(m) { return m[0] === v; });
  if (mi && $('#bc')) $('#bc').innerHTML = 'Beranda / <b>' + mi[1] + '</b>';
  $('#app').classList.remove('open');
  window.scrollTo(0, 0);
  $('#main').innerHTML = '<div class="cards"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div><div class="sk" style="height:240px"></div>';

  try {
    $('#main').innerHTML = await V[v]();
    enhance();
  } catch (e) {
    $('#main').innerHTML = '<div class="card em">' + esc(e.message) + '</div>';
    if (/Sesi berakhir/.test(e.message)) return logout();
  }

  if (v === 'absen' || (v === 'dash' && ME.role === 'peserta')) {
    var bm = $('#bm'), bp = $('#bp');
    if (bm) bm.onclick = function() { geo('masuk'); };
    if (bp) bp.onclick = function() { geo('pulang'); };
    var k = function() {
      var e = $('#clk');
      if (e) e.textContent = new Date().toLocaleTimeString('id-ID', { timeZone: 'Asia/Jayapura' });
    };
    k();
    clearInterval(go.t);
    go.t = setInterval(k, 1000);
    startWatch();
  }

  if (v === 'rekap') {
    var q = function() {
      return {
        from: $('#rf').value,
        to: $('#rt').value,
        institusi: $('#ri') ? $('#ri').value : '',
        onlyAktif: $('#ra') ? $('#ra').value === '1' : false
      };
    };
    var show = async function() {
      var d = await run(function() { return call('rekap', q()); });
      $('#rb').innerHTML = table([
        ['nama', 'Nama'], ['institusi', 'Institusi'], ['hadir', 'Hadir'], ['terlambat', 'Terlambat'],
        ['izin', 'Izin'], ['sakit', 'Sakit'], ['alfa', 'Alfa'], ['terpakai', 'Izin/Sakit/Alfa'], ['nilai', 'Nilai Akhir']
      ], d);
    };
    $('#rs').onclick = async function() { await show(); enhance(); };
    show().then(enhance);
    [['rx', 'xlsx'], ['rp', 'pdf']].forEach(function(pair) {
      $('#' + pair[0]).onclick = async function() {
        dl(await run(function() { return call('rekapExport', Object.assign(q(), { fmt: pair[1] })); }));
      };
    });
  }

  if (v === 'cfg') {
    $('#cs').onclick = function() {
      run(async function() {
        var o = {};
        document.querySelectorAll('[id^=c_]').forEach(function(e) { o[e.id.slice(2)] = e.value.trim(); });
        await call('cfgSave', o);
        CFG = (await call('me')).cfg;
      }, 'Pengaturan berhasil disimpan');
    };
  }
}
